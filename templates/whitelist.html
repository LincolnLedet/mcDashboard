<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Server - MC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mc: {
                            dark: '#1a1a1a',
                            darker: '#121212',
                            green: '#4ade80',
                            gray: '#2a2a2a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-mc-darker text-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Back link -->
        <a href="/" class="text-gray-500 hover:text-mc-green text-sm mb-6 inline-block">&larr; Back to Dashboard</a>

        <div class="bg-mc-dark rounded-lg p-8">
            <h1 class="text-2xl font-bold text-mc-green mb-2">Join the Server</h1>
            <p class="text-gray-500 text-sm mb-6">Enter your Minecraft username to get whitelisted</p>

            <form id="whitelist-form" class="space-y-4">
                <div>
                    <label for="username" class="block text-sm text-gray-400 mb-2">Minecraft Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Steve"
                        pattern="[a-zA-Z0-9_]{3,16}"
                        required
                        class="w-full bg-mc-darker border border-mc-gray rounded-lg px-4 py-3 text-white placeholder-gray-600 focus:outline-none focus:border-mc-green transition"
                    >
                    <p class="text-xs text-gray-600 mt-1">3-16 characters, letters/numbers/underscores</p>
                </div>

                <!-- Cloudflare Turnstile -->
                <div class="cf-turnstile" data-sitekey="{{ turnstile_sitekey }}" data-theme="dark"></div>

                <button
                    type="submit"
                    id="submit-btn"
                    class="w-full bg-mc-green hover:bg-green-400 text-black font-semibold py-3 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    Whitelist Me
                </button>
            </form>

            <div id="message" class="mt-4 hidden"></div>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">
            Server: {{ mc_address }}
        </p>
    </div>

    <script>
        const form = document.getElementById('whitelist-form');
        const submitBtn = document.getElementById('submit-btn');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const captchaToken = document.querySelector('[name="cf-turnstile-response"]')?.value;

            if (!captchaToken) {
                showMessage('Please complete the verification', 'error');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const res = await fetch('/api/whitelist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, captcha_token: captchaToken })
                });
                const data = await res.json();

                if (data.success) {
                    showMessage(data.message, 'success');
                    form.reset();
                    turnstile.reset();
                } else {
                    showMessage(data.error, 'error');
                    turnstile.reset();
                }
            } catch (err) {
                showMessage('Something went wrong. Please try again.', 'error');
                turnstile.reset();
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Whitelist Me';
            }
        });

        function showMessage(text, type) {
            messageDiv.className = `mt-4 p-4 rounded-lg text-sm ${type === 'success' ? 'bg-green-900/30 text-mc-green border border-green-800' : 'bg-red-900/30 text-red-400 border border-red-800'}`;
            messageDiv.textContent = text;
            messageDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
